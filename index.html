<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="常守瑜 Aria Chang 的學術與專業履歷，附 Google Drive 佐證連結。">
    <meta name="color-scheme" content="light">
    <title>常守瑜 Aria Chang｜Academic Profile</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="skip">跳至主要內容</a>

    <aside class="sidebar" aria-label="Profile navigation">
      <div class="sidebar-inner">
        <div class="monogram" aria-hidden="true">常</div>
        <p class="eyebrow">ACADEMIC PROFILE</p>
        <h1>常守瑜<br><span>Aria Chang</span></h1>
        <p class="sidebar-summary" data-i18n="sidebarSummary">學經歷與佐證文件總覽</p>

        <div class="toolbar" aria-label="Page controls">
          <button id="language-toggle" class="control-button" type="button" aria-label="Switch to English">EN</button>
          <button id="print-button" class="control-button" type="button" data-i18n="print">列印</button>
        </div>

        <nav id="site-navigation" class="site-navigation" aria-label="Section navigation"></nav>

        <div class="privacy-note">
          <span class="privacy-dot" aria-hidden="true"></span>
          <span data-i18n="privacyShort">連結可見；文件僅本人可開啟</span>
        </div>
      </div>
    </aside>

    <main id="main-content" class="main-content" tabindex="-1">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow" data-i18n="heroEyebrow">CV &amp; EVIDENCE</p>
        <h2 id="hero-title" data-i18n="heroTitle">學術與專業履歷</h2>
        <p id="last-updated" class="last-updated"></p>
        <div class="utility-bar">
          <label class="search-box">
            <span class="visually-hidden" data-i18n="searchLabel">搜尋紀錄</span>
            <input id="record-search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="搜尋學校、證照、研究或年份…" autocomplete="off">
          </label>
          <button id="filter-missing" class="filter-button" type="button" aria-pressed="false" data-i18n="filterMissing">只顯示待補</button>
          <span id="result-count" class="result-count" aria-live="polite"></span>
        </div>
      </section>

      <section id="front-matter" class="front-matter" aria-label="Profile summary"></section>

      <section class="vault-banner" aria-label="Evidence availability">
        <div>
          <p class="eyebrow" data-i18n="vaultEyebrow">OWNER-ONLY GOOGLE DRIVE</p>
          <h2 data-i18n="vaultTitle">連結可以公開，文件仍然私人</h2>
        </div>
        <p data-i18n="vaultCopy">每個📎圖示會開啟相關佐證。只有登入本人 Google 帳號時可以查看；其他訪客會看到權限要求。灰色📎表示尚缺佐證。</p>
      </section>

      <div id="profile-sections"></div>

      <footer>
        <p data-i18n="footer">本頁為公開專業摘要；私人識別資料與佐證文件未公開。</p>
        <p>© <span id="current-year"></span> Aria Chang</p>
      </footer>
    </main>

    <noscript>此網站需要 JavaScript 才能顯示履歷內容。</noscript>
    <script src="data/profile.js"></script>
    <script src="script.js"></script>
  </body>
</html>
